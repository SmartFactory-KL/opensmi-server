[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenSMI-Server"
dynamic = ["version"]
readme = "README.md"
description = "Asynchronous Python framework for building Smart Machine Interface-compliant OPC UA servers."
authors = [
    { name = "Carsten Harms", email = "Carsten.Harms@dfki.de" },
    { name = "Simon Jungbluth", email = "Simon.Jungbluth@smartfactory.de" },
]
license = "MIT"
license-files = ["LICENSES/MIT.txt"]

# see https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed"
]

requires-python = ">=3.11"

dependencies = [
    "OpenSMI-Core>=0.1",
    "asyncua>=2.0.1,<3", # OPC UA, main dep; has quite a few deps
    "transitions>=0.9, <1", # FSM; TODO remove it
    "structlog>=26", # structured logging; has no deps
    "typing-extensions>=4.16.0", # backported type hints; already a dep of asyncua
]

[project.urls]
Repository = "https://github.com/SmartFactory-KL/opensmi-server"
Documentation = "https://smartfactory-kl.github.io/opensmi-server/"

[project.optional-dependencies]
rich = [
    "rich>=15.0.0", # colorful logging; transitive deps: markdown-it-py, mdurl & pygments
    "colorama>=0.4; sys_platform == 'win32'", # colors in terminal on Windows; has no deps
]
json = [
    "orjson>=3, <4", # faster JSON logging; has no deps
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.15",
    # "mypy>=2",
    "pytest>=9",
    "pytest-asyncio>=1",
    "pytest-cov>=7",
    "pytest-xdist>=3",
    "pytest-html>=4",
    "pytest-timeout>=2",
    #"reuse[charset-normalizer]"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
exclude = ["tests", "docs", "examples"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4
fix = true


[tool.ruff.lint]
select = ["A", "ANN001", "ANN201", "ANN205", "ANN206",
    "ASYNC", "B", "C4", "CPY", "D", "DTZ", "E", "EM",
    "EXE", "F", "FA", "ICN", "I", "LOG", "T20", "PT",
    "SLF", "SIM", "C901", "N", "PIE", "PLE", "PYI", "PT",
    "Q", "RSE", "RET", "TD", "PERF", "UP", "FURB", "RUF",
    "TRY"]
ignore = ["D203", "D213"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-FileCopyrightText: \\d{4}"
author = "OpenSMI Contributors"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "T", "SLF001"]
"tools/**" = ["T"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.mypy]
packages = "src/opensmi/server"

warn_unused_configs = true
pretty = true

strict = true

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
executionEnvironments = [{ root = "src" }]

[tool.pydoctor]
project-name = "OpenSMI"
add-package = ["src/opensmi/server"]
docformat = "restructuredtext"
theme = "readthedocs"
# verbose = 1
# warnings-as-errors = true
intersphinx = ["https://opcua-asyncio.readthedocs.io/en/latest/objects.inv"] # TODO(CaHa): does not work
